name: Monthly Climate Dataset Update

on:
  schedule:
    # Runs at 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and build NASA POWER & CMIP6 climate datasets
        run: npm run data

      - name: Validate dataset integrity and detect outliers
        run: npm run validate:data

      - name: Run test suite
        run: npm test

      - name: Check for dataset changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain src/data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dataset changes detected for this cycle."
          fi

      - name: Create Pull Request for monthly data update
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): automated monthly NASA climate dataset update'
          branch: 'data/monthly-update'
          delete-branch: true
          title: 'chore(data): monthly NASA climate & CMIP6 dataset update'
          body: |
            ## Automated Monthly Dataset Ingestion

            This PR was automatically generated by the scheduled monthly NASA Earth observation pipeline.

            ### Verified Integrity Checks:
            - [x] All 64 districts and 8 divisions updated
            - [x] Zero missing, null, or NaN values in daily/monthly series
            - [x] Outlier bounds verified across temperature, precipitation, and soil wetness
            - [x] Downscaled CMIP6 multi-model ensembles intact
            - [x] Full automated test suite passing
          labels: |
            dataset
            automated-pr
