name: Monthly Climate Dataset Update & Validation

on:
  schedule:
    # Runs at 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Online Data Pipeline (NASA POWER, GBIF, EONET, World Bank)
        run: npm run data

      - name: Validate dataset schemas, provenance, and physical outlier bounds
        run: npm run validate:data

      - name: Validate climate impacts literature sources
        run: npm run validate:impacts

      - name: Run automated test suite
        run: npm test

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Check for dataset changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain src/data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dataset changes detected. Preparing pull request."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dataset changes detected for this monthly cycle."
          fi

      - name: Create Pull Request for monthly data update
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): automated monthly NASA climate dataset update'
          branch: 'data/monthly-update'
          delete-branch: true
          title: 'chore(data): monthly NASA climate & derived analysis dataset update'
          body: |
            ## Automated Monthly Dataset Ingestion (Phase 9D)

            This PR was automatically generated by the scheduled monthly NASA Earth observation and open data pipeline.

            ### Verified Integrity Checks:
            - [x] All 64 districts and 8 divisions updated and validated
            - [x] Zero missing, null, or NaN values in daily/monthly series
            - [x] Outlier bounds verified across temperature, precipitation, and soil wetness
            - [x] Derived analysis JSONs (`climate-stats`, `extremes`, `gbif-occurrences`, `eonet-events`, `yield-climate`) verified with required provenance fields
            - [x] GBIF observer effort disclosures and World Bank small-sample causality notices intact
            - [x] Full automated test suite and TypeScript typechecks passing
            - [x] Zero secret credentials stored or transmitted
          labels: |
            dataset
            automated-pr
            reliability
